plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version = '0.1.0-lab'
base { archivesName = 'mtmc-peer-lab' }
repositories { mavenCentral() }
configurations { peerLibraries }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    implementation files('../../../coordination/build/install/mtmc-coordination/lib/mtmc-coordination-0.1.0-prototype.jar')
    peerLibraries 'io.grpc:grpc-netty-shaded:1.76.0'
    peerLibraries 'io.grpc:grpc-protobuf:1.76.0'
    peerLibraries 'io.grpc:grpc-stub:1.76.0'
    peerLibraries 'com.google.protobuf:protobuf-java:4.33.0'
    peerLibraries 'com.google.guava:guava:33.6.0-jre'
}
configurations.implementation.extendsFrom(configurations.peerLibraries)
afterEvaluate {
    configurations.peerLibraries.resolvedConfiguration.resolvedArtifacts.each {
        def id = it.moduleVersion.id
        dependencies.add('include', "${id.group}:${id.name}:${id.version}")
    }
}
// Package the actual coordinator code with the lab adapter; nested third-party libraries retain Maven metadata.
jar {
    from(zipTree('../../../coordination/build/install/mtmc-coordination/lib/mtmc-coordination-0.1.0-prototype.jar')) {
        exclude 'META-INF/MANIFEST.MF'
    }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
